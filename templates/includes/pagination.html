{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="分页">{% if page_obj.has_previous %}<a class="button button-secondary" href="{% querystring page=page_obj.previous_page_number %}">上一页</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button button-secondary" href="{% querystring page=page_obj.next_page_number %}">下一页{% include 'includes/icon.html' with name='arrow-right' %}</a>{% endif %}</nav>{% endif %}
