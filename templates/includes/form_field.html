<div class="field">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %}<span class="optional">（选填）</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</p>{% endif %}
  {{ field.errors }}
</div>
