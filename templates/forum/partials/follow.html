<form id="follow-{{ topic.pk }}" method="post" action="{% url 'forum:follow' topic.slug %}" hx-post="{% url 'forum:follow' topic.slug %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="button">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="button {% if followed %}button-secondary{% else %}button-primary{% endif %}">{% if followed %}{% include 'includes/icon.html' with name='check' %}已关注{% else %}{% include 'includes/icon.html' with name='plus' %}关注话题{% endif %}</button></form>
