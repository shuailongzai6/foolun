<form id="follow-{{ topic.pk }}" method="post" action="{% url 'forum:follow' topic.slug %}" hx-post="{% url 'forum:follow' topic.slug %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button">
  {% csrf_token %}<input type="hidden" name="next" value="{{ request.POST.next|default:request.get_full_path }}">
  <button class="btn btn-sm {% if followed %}btn-outline{% else %}btn-secondary{% endif %}" aria-pressed="{% if followed %}true{% else %}false{% endif %}">{% if followed %}{% icon 'check' %}已关注{% else %}{% icon 'plus' %}关注{% endif %}</button>
</form>
