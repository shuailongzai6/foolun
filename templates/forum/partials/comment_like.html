<form method="post" action="{% url 'forum:like_comment' comment.pk %}" hx-post="{% url 'forum:like_comment' comment.pk %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button">
  {% csrf_token %}
  <button class="action" aria-pressed="{% if comment.viewer_liked %}true{% else %}false{% endif %}" aria-label="赞同{% if comment.like_count %}，当前 {{ comment.like_count }}{% endif %}">{% icon 'thumb-up' %}{% if comment.like_count %}{{ comment.like_count }}{% else %}赞同{% endif %}</button>
</form>
